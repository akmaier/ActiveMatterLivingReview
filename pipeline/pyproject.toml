[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amlr"
version = "0.0.1"
description = "Active Matter Living Review pipeline: PRISMA 2020 discovery, dedup, screening, extraction, and site/paper rendering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andreas Maier", email = "andreas.maier@fau.de" }]

dependencies = [
  "requests>=2.32",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "tomli>=2.0;python_version<'3.11'",
  "pyarrow>=15.0",
  "pandas>=2.2",
  "lxml>=5.1",
  "SPARQLWrapper>=2.0",
  "pymupdf>=1.24",
  "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-vcr>=1.0.2",
  "ruff>=0.4",
  "mypy>=1.9",
]
asreview = [
  "asreview>=1.6",
]
scholar = [
  "scholarly>=1.7",
]

[project.scripts]
amlr = "amlr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/amlr"]

# NOTE: `experteye_scraper` is intentionally NOT listed as a `[project]`
# dependency because it is not published to PyPI. Install it in editable
# mode alongside this package before running `amlr`:
#
#     pip install -e ../../experteye
#     pip install -e .
#
# See `pipeline/README.md` for the exact bootstrap sequence.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
